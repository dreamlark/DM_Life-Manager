# dm-life All-in-One 内置 Caddy 配置（容器内部，:8080）
# 上游为本容器内的统一后端：server(4100) + 静态前端(dist)
{
  admin off
  # 容器以非 root(node, uid 1000)运行，caddy 默认数据目录 /var/lib/caddy 不可写；
  # 显式指向挂载卷内的可写路径（同时便于未来 P3 TLS 证书持久化）。
  storage file_system /data/caddy
}

:8080 {
  encode gzip

  # 静态前端（web-collab 构建产物）
  root * /app/packages/web-collab/dist

  # ---- 后端路由（必须前置，先于 SPA 回退）----
  # 统一后端（server）：个人域 + 账户/家庭/共享/WS 全部经 /trpc /api /ws
  handle /trpc* {
    reverse_proxy 127.0.0.1:4100
  }
  handle /api/* {
    reverse_proxy 127.0.0.1:4100
  }
  handle /health* {
    reverse_proxy 127.0.0.1:4100
  }
  handle /ready* {
    reverse_proxy 127.0.0.1:4100
  }
  handle /ws* {
    reverse_proxy 127.0.0.1:4100
  }

  # ---- SPA 回退（兜底，仅当前面所有后端路由均未匹配时才生效）----
  # 注意：try_files 必须放在兜底 handle 内，否则会在 rewrite 阶段把 /trpc 等
  # API 路径改写成 /index.html，导致后端路由永远匹配不到（已在生产实跑中复现）。
  handle {
    try_files {path} /index.html
    file_server
  }
}

# ===== 自动 HTTPS（P3 启用，需 caddy 能获取证书）=====
# 检测到 Tailscale 时：`tailscale cert 机器名.ts.net` 生成证书后，把上面 :8080 块替换为：
# 机器名.ts.net {
#   encode gzip
#   root * /app/packages/web-collab/dist
#   handle /trpc* { reverse_proxy 127.0.0.1:4100 }
#   handle /api/* { reverse_proxy 127.0.0.1:4100 }
#   handle /health* { reverse_proxy 127.0.0.1:4100 }
#   handle /ready* { reverse_proxy 127.0.0.1:4100 }
#   handle /ws* { reverse_proxy 127.0.0.1:4100 }
#   handle { try_files {path} /index.html; file_server }
# }
